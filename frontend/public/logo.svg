<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MoneyTrack AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12B886"/>
      <stop offset="1" stop-color="#0A9468"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- an M drawn as a line chart: Money + Track -->
  <polyline points="13,47 13,19 32,38 51,19 51,47"
            fill="none" stroke="#FFFFFF" stroke-width="5.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- data points on the chart -->
  <g fill="#0E9F74" stroke="#FFFFFF" stroke-width="3">
    <circle cx="13" cy="19" r="4.2"/>
    <circle cx="32" cy="38" r="4.2"/>
    <circle cx="51" cy="19" r="4.2"/>
  </g>
</svg>
